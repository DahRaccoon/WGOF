<script>
    function toggleScorecard(id, row) {
        var el = document.getElementById(id);
        var isVisible = el.style.display === "table-row";
        document.querySelectorAll('.scorecard-wrapper').forEach(sc => sc.style.display = 'none');
        document.querySelectorAll('.clickable-row').forEach(r => r.classList.remove('active-row'));
        if (!isVisible) {
            el.style.display = "table-row";
            row.classList.add('active-row');
        }
    }

    function updateClock() {
        const now = new Date();
        const hr = now.getHours(), min = now.getMinutes(), sec = now.getSeconds();
        document.getElementById('hr').style.transform = `translateX(-50%) rotate(${30 * hr + min / 2}deg)`;
        document.getElementById('min').style.transform = `translateX(-50%) rotate(${6 * min}deg)`;
        document.getElementById('sec').style.transform = `translateX(-50%) rotate(${6 * sec}deg)`;
        document.getElementById('digital-local').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    setInterval(updateClock, 1000); updateClock();
</script>
